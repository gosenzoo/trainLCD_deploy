<svg id="display" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- defs.svgから移植したグラデーション・フィルター定義 -->
    <defs>
        <linearGradient id="outerGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgb(255, 255, 255)" />
        <stop offset="17.78%" stop-color="rgb(228, 228, 228)" />
        <stop offset="48.89%" stop-color="rgb(182, 182, 182)" />
        <stop offset="51.11%" stop-color="rgb(158, 158, 158)" />
        <stop offset="81.11%" stop-color="rgb(201, 201, 201)" />
        <stop offset="100%" stop-color="rgb(228, 228, 228)" />
        </linearGradient>
        <linearGradient id="outlineGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgb(44, 44, 44)" />
        <stop offset="100%" stop-color="rgb(211, 211, 211)" />
        </linearGradient>
    </defs>

    <!-- 背景 -->
    <rect lcdParts="static" id="background" x="0" y="0" width="1920" height="1080" fill="#FFFFFF" />


    <!-- 路線(右向き) -->
    <g lcdParts="static" isDraw="direction == 0">
        <rect lcdParts="static" x="90" y="788" width="400" height="90" fill="#555555" />
        <rect lcdParts="static" x="490" y="788" width="470" height="90" fill="#555555" />
        <rect lcdParts="static" x="960" y="788" width="470" height="90" fill="#555555" />
        <polygon lcdParts="static" points="1430,788 1790,788 1830,833 1790,878 1430,878" fill="#555555" />
    </g>
    <!-- 路線(左向き) -->
    <g lcdParts="static" isDraw="direction == 1">
        <polygon lcdParts="static" points="490,788 130,788 90,833 130,878 490,878" fill="#555555" />
        <rect lcdParts="static" x="490" y="788" width="470" height="90" fill="#555555" />
        <rect lcdParts="static" x="960" y="788" width="470" height="90" fill="#555555" />
        <rect lcdParts="static" x="1430" y="788" width="400" height="90" fill="#555555" />
    </g>

    <!-- 駅マーク -->
    <circle lcdParts="static" cx="960" cy="833" r="42" fill="#ffffff" />

    <!-- 駅名 -->
    <rect lcdParts="textBox" x="700" y="625" width="520" height="80" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}}' />
    <rect lcdParts="textBox" x="700" y="718" width="520" height="45" fill="#bbbbbb80" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}}' />

    <!-- 説明 -->
    <g lcdPats="arrange">
        <rect lcdParts="arrangeArea" x="100" y="400" width="1720" height="85" fill="#bbbbbb80" />
        <rect lcdPats="textBox" lcdText="#{}から" lcd-fitX="true" x="100" y="85" width="1720" height="85" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}}' />
        <rect lcdPats="textBox" lcdText="#{}" lcd-fitX="true" x="100" y="85" width="1720" height="85" fill="#bbbbbb80" />
        <rect lcdPats="textBox" lcdText="となります" lcd-fitX="true" x="100" y="85" width="1720" height="85" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}}' />
    </g>
    <!-- 説明(英語) -->
    <g lcdPats="arrange">
        <rect lcdParts="arrangeArea" x="100" y="492" width="1720" height="42" fill="#bbbbbb80" />
        <rect lcdPats="textBox" lcdText="From #{} station, this train will become a " lcd-fitX="true" x="100" y="492" width="1720" height="42" fill="#bbbbbb80" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}}' />
        <rect lcdPats="textBox" lcdText="#{}" lcd-fitX="true" x="100" y="492" width="1720" height="42" fill="#bbbbbb80" />
        <rect lcdPats="textBox" lcdText=" train." lcd-fitX="true" x="100" y="492" width="1720" height="42" fill="#bbbbbb80" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}}' />
    </g>

    <!-- 種別表示(右向き) -->
    <g lcdParts="group" isDraw="direction == 0">
        <!-- 種別表示(左) -->
        <g lcdParts="group">
            <g lcdParts="group">
                <rect lcdParts="static" x="330" y="755" width="365" height="156" rx="18" ry="18" fill="url(#outlineGradient)" />
                <rect lcdParts="static" lcd-color="whole.trainTypeBackColor" x="333" y="758" width="359" height="150" rx="15" ry="15" fill="#c6c6c6" />
                <rect lcdParts="static" x="333" y="758" width="359" height="150" rx="15" ry="15" fill="url(#outerGradient)" style="mix-blend-mode: multiply;" />
            </g>
            <rect lcdParts="textBox" lcdText="#{whole.trainType}" x="350" y="766" width="325" height="80" fill="#66666670" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
            <rect lcdParts="textBox" lcdText="#{whole.trainTypeEng}" x="350" y="855" width="325" height="40" fill="#66666670" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
        </g>
        <!-- 種別表示(右) -->
        <g lcdParts="group">
            <g lcdParts="group">
                <rect lcdParts="static" x="1225" y="755" width="365" height="156" rx="18" ry="18" fill="url(#outlineGradient)" />
                <rect lcdParts="static" lcd-color="whole.trainTypeBackColor" x="1228" y="758" width="359" height="150" rx="15" ry="15" fill="#c6c6c6" />
                <rect lcdParts="static" x="1228" y="758" width="359" height="150" rx="15" ry="15" fill="url(#outerGradient)" style="mix-blend-mode: multiply;" />
            </g>
            <rect lcdParts="textBox" lcdText="#{whole.trainType}" x="1245" y="766" width="325" height="80" fill="#66666670" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
            <rect lcdParts="textBox" lcdText="#{whole.trainTypeEng}" x="1245" y="855" width="325" height="40" fill="#66666670" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
        </g>
    </g>
    <!-- 種別表示(左向き) -->
    <g lcdParts="group" isDraw="direction == 1">
        <!-- 種別表示(左) -->
        <g lcdParts="group">
            <g lcdParts="group">
                <rect lcdParts="static" x="330" y="755" width="365" height="156" rx="18" ry="18" fill="url(#outlineGradient)" />
                <rect lcdParts="static" lcd-color="whole.trainTypeBackColor" x="333" y="758" width="359" height="150" rx="15" ry="15" fill="#c6c6c6" />
                <rect lcdParts="static" x="333" y="758" width="359" height="150" rx="15" ry="15" fill="url(#outerGradient)" style="mix-blend-mode: multiply;" />
            </g>
            <rect lcdParts="textBox" lcdText="#{whole.trainType}" x="350" y="766" width="325" height="80" fill="#66666670" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
            <rect lcdParts="textBox" lcdText="#{whole.trainTypeEng}" x="350" y="855" width="325" height="40" fill="#66666670" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
        </g>
        <!-- 種別表示(右) -->
        <g lcdParts="group">
            <g lcdParts="group">
                <rect lcdParts="static" x="1225" y="755" width="365" height="156" rx="18" ry="18" fill="url(#outlineGradient)" />
                <rect lcdParts="static" lcd-color="whole.trainTypeBackColor" x="1228" y="758" width="359" height="150" rx="15" ry="15" fill="#c6c6c6" />
                <rect lcdParts="static" x="1228" y="758" width="359" height="150" rx="15" ry="15" fill="url(#outerGradient)" style="mix-blend-mode: multiply;" />
            </g>
            <rect lcdParts="textBox" lcdText="#{whole.trainType}" x="1245" y="766" width="325" height="80" fill="#66666670" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
            <rect lcdParts="textBox" lcdText="#{whole.trainTypeEng}" x="1245" y="855" width="325" height="40" fill="#66666670" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
        </g>
    </g>



    <!-- 参考画像 -->
    <image href="./../../../imgs/tokyu-trainTypeChange.jpg" x="0" y="0" width="1920" height="1080" opacity="0.2" />
</svg>
