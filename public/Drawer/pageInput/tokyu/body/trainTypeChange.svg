<svg id="display" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
    <!-- defs.svgから移植したグラデーション・フィルター定義 -->
    <defs>
        <linearGradient id="innerGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgb(255, 255, 255)" />
            <stop offset="51%" stop-color="rgb(220, 220, 220)" />
            <stop offset="51.11%" stop-color="rgb(158, 158, 158)" />
            <stop offset="81.11%" stop-color="rgb(201, 201, 201)" />
            <stop offset="100%" stop-color="rgb(228, 228, 228)" />
        </linearGradient>
        <linearGradient id="outerGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgb(255, 255, 255)" />
            <stop offset="17.78%" stop-color="rgb(228, 228, 228)" />
            <stop offset="48.89%" stop-color="rgb(182, 182, 182)" />
            <stop offset="51.11%" stop-color="rgb(158, 158, 158)" />
            <stop offset="81.11%" stop-color="rgb(201, 201, 201)" />
            <stop offset="100%" stop-color="rgb(228, 228, 228)" />
        </linearGradient>
        <filter id="outline">
            <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="2" />
            <feFlood flood-color="black" result="BLACK"/>
            <feComposite in="BLACK" in2="DILATED" operator="in" result="OUTLINE"/>
            <feMerge>
                <feMergeNode in="OUTLINE"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- 背景 -->
    <rect lcdParts="static" id="background" x="0" y="0" width="1920" height="1080" fill="#FFFFFF" />


    <g lcdParts="group" shadowId="inner, outer" filter="url(#outline)">
        <!-- 路線(右向き) -->
        <g lcdParts="group" isDraw="whole.direction == 0">
            <rect lcdParts="static" lcd-color="trainTypeChange.rootSection.color" x="90" y="788" width="400" height="90" fill="#555555" />
            <rect lcdParts="static" lcd-color="trainTypeChange.leftSection.color" x="490" y="788" width="472" height="90" fill="#555555" />
            <rect lcdParts="static" lcd-color="trainTypeChange.rightSection.color" x="960" y="788" width="470" height="90" fill="#555555" />
            <polygon lcdParts="static" lcd-color="trainTypeChange.arrowSection.color" points="1430,788 1790,788 1830,833 1790,878 1430,878" fill="#555555" />
        </g>
        <!-- 路線(左向き) -->
        <g lcdParts="group" isDraw="whole.direction == 1">
            <polygon lcdParts="static" lcd-color="trainTypeChange.arrowSection.color" points="490,788 130,788 90,833 130,878 490,878" fill="#555555" />
            <rect lcdParts="static" lcd-color="trainTypeChange.rightSection.color" x="490" y="788" width="472" height="90" fill="#555555" />
            <rect lcdParts="static" lcd-color="trainTypeChange.leftSection.color" x="960" y="788" width="470" height="90" fill="#555555" />
            <rect lcdParts="static" lcd-color="trainTypeChange.rootSection.color" x="1430" y="788" width="400" height="90" fill="#555555" />
        </g>
    </g>
    <!-- 路線ベース1影 -->
    <rect lcdParts="mulShadow" shadowId="inner" x="0" y="788" width="1920" height="90" fill="url(#innerGradient)" style="mix-blend-mode: multiply;" />

    <!-- 駅マーク -->
    <circle lcdParts="static" shadowId="outer" cx="960" cy="833" r="42" fill="#ffffff" />

    <!-- 路線ベース2影 -->
    <rect lcdParts="mulShadow" shadowId="outer" x="0" y="788" width="1920" height="90" fill="url(#outerGradient)" style="mix-blend-mode: multiply;" />

    <!-- 駅名 -->
    <rect lcdParts="textBox" lcdText="#{trainTypeChange.changeStation.name}" x="700" y="625" width="520" height="80" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(0, 0, 0)", "letterSpacing": {"2": "30px", "3": "20px"}}' />
    <rect lcdParts="textBox" lcdText="#{trainTypeChange.changeStation.eng}" x="700" y="718" width="520" height="45" fill="#bbbbbb80" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(0, 0, 0)", "letterSpacing": {"2": "30px", "3": "20px"}}' />

    <!-- 説明 -->
    <g lcdParts="arrange" lcd-holAlign="center">
        <rect lcdParts="arrangeArea" x="100" y="400" width="1720" height="85" fill="#bbbbbb80" />
        <rect lcdParts="textBox" lcdText="#{trainTypeChange.changeStation.name}から" lcd-fitX="true" x="100" y="85" width="1720" height="85" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(0, 0, 0)"}' />
        <rect lcdParts="textBox" lcdText="#{trainTypeChange.arrowType.name}" lcd-color="trainTypeChange.arrowType.backColor" lcd-fitX="true" x="100" y="85" width="1720" height="85" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(0, 0, 0)"}' />
        <rect lcdParts="textBox" lcdText="となります" lcd-holAlign="right" x="100" y="85" width="1720" height="85" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(0, 0, 0)"}' />
    </g>
    <!-- 説明(英語) -->
    <g lcdParts="arrange" lcd-holAlign="center">
        <rect lcdParts="arrangeArea" x="100" y="492" width="1720" height="42" fill="#bbbbbb80" />
        <rect lcdParts="textBox" lcdText="From #{trainTypeChange.changeStation.eng} station, this train will become a " lcd-fitX="true" x="100" y="492" width="1720" height="42" fill="#bbbbbb80" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(0, 0, 0)"}' />
        <rect lcdParts="textBox" lcdText="#{trainTypeChange.arrowType.eng} " lcd-color="trainTypeChange.arrowType.backColor" lcd-fitX="true" x="100" y="492" width="1720" height="42" fill="#bbbbbb80" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(0, 0, 0)"}' />
        <rect lcdParts="textBox" lcdText="train." lcd-fitX="true" x="100" y="492" width="1720" height="42" fill="#bbbbbb80" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(0, 0, 0)"}' />
    </g>

    <!-- 種別表示(右向き) -->
    <g lcdParts="group" isDraw="whole.direction == 0">
        <!-- 種別表示(左) -->
        <g lcdParts="group">
            <g lcdParts="group">
                <rect lcdParts="static" x="330" y="755" width="365" height="156" rx="18" ry="18" fill="url(#outlineGradient)" />
                <rect lcdParts="static" lcd-color="trainTypeChange.rootType.backColor" x="333" y="758" width="359" height="150" rx="15" ry="15" fill="#c6c6c6" />
                <rect lcdParts="static" x="333" y="758" width="359" height="150" rx="15" ry="15" fill="url(#outerGradient)" style="mix-blend-mode: multiply;" />
            </g>
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.rootType.name}" x="350" y="766" width="325" height="80" fill="#66666670" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.rootType.eng}" x="350" y="855" width="325" height="40" fill="#66666670" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
        </g>
        <!-- 種別表示(右) -->
        <g lcdParts="group">
            <g lcdParts="group">
                <rect lcdParts="static" x="1225" y="755" width="365" height="156" rx="18" ry="18" fill="url(#outlineGradient)" />
                <rect lcdParts="static" lcd-color="trainTypeChange.arrowType.backColor" x="1228" y="758" width="359" height="150" rx="15" ry="15" fill="#c6c6c6" />
                <rect lcdParts="static" x="1228" y="758" width="359" height="150" rx="15" ry="15" fill="url(#outerGradient)" style="mix-blend-mode: multiply;" />
            </g>
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.arrowType.name}" x="1245" y="766" width="325" height="80" fill="#66666670" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.arrowType.eng}" x="1245" y="855" width="325" height="40" fill="#66666670" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
        </g>
    </g>
    <!-- 種別表示(左向き) -->
    <g lcdParts="group" isDraw="whole.direction == 1">
        <!-- 種別表示(左) -->
        <g lcdParts="group">
            <g lcdParts="group">
                <rect lcdParts="static" x="330" y="755" width="365" height="156" rx="18" ry="18" fill="url(#outlineGradient)" />
                <rect lcdParts="static" lcd-color="trainTypeChange.arrowType.backColor" x="333" y="758" width="359" height="150" rx="15" ry="15" fill="#c6c6c6" />
                <rect lcdParts="static" x="333" y="758" width="359" height="150" rx="15" ry="15" fill="url(#outerGradient)" style="mix-blend-mode: multiply;" />
            </g>
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.arrowType.name}" x="350" y="766" width="325" height="80" fill="#66666670" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.arrowType.eng}" x="350" y="855" width="325" height="40" fill="#66666670" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
        </g>
        <!-- 種別表示(右) -->
        <g lcdParts="group">
            <g lcdParts="group">
                <rect lcdParts="static" x="1225" y="755" width="365" height="156" rx="18" ry="18" fill="url(#outlineGradient)" />
                <rect lcdParts="static" lcd-color="trainTypeChange.rootType.backColor" x="1228" y="758" width="359" height="150" rx="15" ry="15" fill="#c6c6c6" />
                <rect lcdParts="static" x="1228" y="758" width="359" height="150" rx="15" ry="15" fill="url(#outerGradient)" style="mix-blend-mode: multiply;" />
            </g>
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.rootType.name}" x="1245" y="766" width="325" height="80" fill="#66666670" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.rootType.eng}" x="1245" y="855" width="325" height="40" fill="#66666670" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "3px 3px 3px rgb(50, 50, 50)"}' />
        </g>
    </g>

    <!-- 路線名(右向き) -->
    <g lcdParts="group" isDraw="(whole.direction == 0) and (trainTypeChange.isDrawLinename)">
        <!-- 左側 -->
        <g lcdParts="arrange" lcd-holAlign="center" arrange-interval="20">
            <rect lcdParts="arrangeArea" x="90" y="930" width="845" height="58" fill="#bbbbbb80" />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.rootLine.name}" lcd-color="trainTypeChange.rootSection.color" lcd-fitX="true" x="90" y="930" width="845" height="58" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "1px 1px 1px rgb(20, 20, 20)"}' />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.rootLine.eng}" lcd-color="trainTypeChange.rootSection.color" lcd-margin="12" lcd-fitX="true" x="90" y="942" width="845" height="35" fill="#55555580" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "1px 1px 1px rgb(20, 20, 20)"}' />
        </g>
        <!-- 右側 -->
        <g  lcdParts="arrange" lcd-holAlign="center" arrange-interval="20">
            <rect lcdParts="arrangeArea" x="985" y="930" width="845" height="58" fill="#bbbbbb80" />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.arrowLine.name}" lcd-color="trainTypeChange.arrowSection.color" lcd-fitX="true" x="985" y="930" width="845" height="58" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "1px 1px 1px rgb(20, 20, 20)"}' />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.arrowLine.eng}" lcd-color="trainTypeChange.arrowSection.color" lcd-margin="12" lcd-fitX="true" x="985" y="942" width="845" height="35" fill="#55555580" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "1px 1px 1px rgb(20, 20, 20)"}' />
        </g>
    </g>
    <!-- 路線名(左向き) -->
    <g lcdParts="group" isDraw="(whole.direction == 1) and (trainTypeChange.isDrawLinename)">
        <!-- 左側 -->
        <g lcdParts="arrange" lcd-holAlign="center" arrange-interval="20">
            <rect lcdParts="arrangeArea" x="90" y="930" width="845" height="58" fill="#bbbbbb80" />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.arrowLine.name}" lcd-color="trainTypeChange.arrowSection.color" lcd-fitX="true" x="90" y="930" width="845" height="58" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "1px 1px 1px rgb(20, 20, 20)"}' />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.arrowLine.eng}" lcd-color="trainTypeChange.arrowSection.color" lcd-margin="12" lcd-fitX="true" x="90" y="942" width="845" height="35" fill="#55555580" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "1px 1px 1px rgb(20, 20, 20)"}' />
        </g>
        <!-- 右側 -->
        <g  lcdParts="arrange" lcd-holAlign="center" arrange-interval="20">
            <rect lcdParts="arrangeArea" x="985" y="930" width="845" height="58" fill="#bbbbbb80" />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.rootLine.name}" lcd-color="trainTypeChange.rootSection.color" lcd-fitX="true" x="985" y="930" width="845" height="58" fill="#bbbbbb80" data-style='{"fontFamily": "BIZ UDGothic", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "1px 1px 1px rgb(20, 20, 20)"}' />
            <rect lcdParts="textBox" lcdText="#{trainTypeChange.rootLine.eng}" lcd-color="trainTypeChange.rootSection.color" lcd-margin="12" lcd-fitX="true" x="985" y="942" width="845" height="35" fill="#55555580" data-style='{"fontFamily": "sans-serif", "fontWeight": "bold", "textAnchor": "middle", "fill": "rgb(255, 255, 255)", "letterSpacing": {"2": "30px", "3": "20px"}, "textShadow": "1px 1px 1px rgb(20, 20, 20)"}' />
        </g>
    </g>



    <!-- 参考画像 -->
    <image href="./../../../imgs/tokyu-trainTypeChange.jpg" x="0" y="0" width="1920" height="1080" opacity="0.2" />
</svg>
